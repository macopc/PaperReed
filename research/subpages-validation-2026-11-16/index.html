<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Reed 设置子页</title><style>:root{--foreground:#303730;--muted-foreground:#626b60;--primary:#4b634f;--secondary:#f2f1eb;--border:#dfe2d9;--radius:6px;--font-sans:-apple-system,sans-serif}body{margin:0;font:13px/1.6 var(--font-sans);color:var(--foreground)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select{font:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--secondary);color:var(--primary)}button:focus-visible,select:focus-visible{outline:2px solid var(--primary)}button:disabled{opacity:.45;cursor:default}[hidden]{display:none}figure{margin:0}img{display:block;width:100%;border:1px solid var(--border);border-radius:var(--radius);box-sizing:border-box}figcaption,footer{font-size:12px;color:var(--muted-foreground);margin:6px 0}a{color:var(--primary)}</style><nav><select aria-label="设置页面" id="page"><option value="general">通用</option><option value="accounts">邮箱账号</option><option value="shortcuts">快捷键</option><option value="compact-accounts">小窗口 · 账号</option><option value="compact-shortcuts">小窗口 · 快捷键</option><option value="shortcuts-empty">无搜索结果</option></select><button id="after" aria-pressed="true">本轮</button><button id="before" aria-pressed="false">上一轮</button></nav><figure data-page="general" data-phase="before" hidden><figcaption>通用 · 上一轮 · 实际 Electron 窗口</figcaption><img src="before-general.png" alt="通用"></figure><figure data-page="general" data-phase="after" ><figcaption>通用 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-general.png" alt="通用"></figure><figure data-page="accounts" data-phase="before" hidden><figcaption>邮箱账号 · 上一轮 · 实际 Electron 窗口</figcaption><img src="before-accounts.png" alt="邮箱账号"></figure><figure data-page="accounts" data-phase="after" hidden><figcaption>邮箱账号 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-account-identity.png" alt="邮箱账号"></figure><figure data-page="shortcuts" data-phase="before" hidden><figcaption>快捷键 · 上一轮 · 实际 Electron 窗口</figcaption><img src="before-shortcuts.png" alt="快捷键"></figure><figure data-page="shortcuts" data-phase="after" hidden><figcaption>快捷键 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-shortcuts.png" alt="快捷键"></figure><figure data-page="compact-accounts" data-phase="after" hidden><figcaption>小窗口 · 账号 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-compact-accounts.png" alt="小窗口 · 账号"></figure><figure data-page="compact-shortcuts" data-phase="after" hidden><figcaption>小窗口 · 快捷键 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-compact-shortcuts.png" alt="小窗口 · 快捷键"></figure><figure data-page="shortcuts-empty" data-phase="after" hidden><figcaption>无搜索结果 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-shortcuts-empty.png" alt="无搜索结果"></figure><footer>独立测试账号；未连接真实邮箱。<a href="README.md">验证与边界</a></footer><script>let phase='after';const page=document.getElementById('page'),before=document.getElementById('before'),after=document.getElementById('after');function update(){before.disabled=!['general','accounts','shortcuts'].includes(page.value);if(before.disabled)phase='after';before.setAttribute('aria-pressed',String(phase==='before'));after.setAttribute('aria-pressed',String(phase==='after'));document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.page!==page.value||f.dataset.phase!==phase);}page.onchange=update;before.onclick=()=>{phase='before';update();};after.onclick=()=>{phase='after';update();};</script></html>
