<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Reed 邮件规则</title><style>:root{--foreground:#303730;--muted-foreground:#626b60;--primary:#4b634f;--secondary:#f2f1eb;--border:#dfe2d9;--radius:6px;--font-sans:-apple-system,sans-serif}body{margin:0;font:13px/1.6 var(--font-sans);color:var(--foreground)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select{font:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--secondary);color:var(--primary)}button:focus-visible,select:focus-visible{outline:2px solid var(--primary)}button:disabled{opacity:.45;cursor:default}[hidden]{display:none}figure{margin:0}img{display:block;width:100%;border:1px solid var(--border);border-radius:var(--radius);box-sizing:border-box}figcaption,footer{font-size:12px;color:var(--muted-foreground);margin:6px 0}a{color:var(--primary)}</style><nav><select aria-label="查看页面" id="page"><option value="rules">规则设置</option><option value="preview">预览已有邮件</option><option value="category">手动分类与视图</option><option value="compact">紧凑窗口</option></select></nav><figure data-page="rules" ><figcaption>规则设置 · 实际 Electron 窗口</figcaption><img src="rules.png" alt="规则设置"></figure><figure data-page="preview" hidden><figcaption>预览已有邮件 · 实际 Electron 窗口</figcaption><img src="preview.png" alt="预览已有邮件"></figure><figure data-page="category" hidden><figcaption>手动分类与视图 · 实际 Electron 窗口</figcaption><img src="category.png" alt="手动分类与视图"></figure><figure data-page="compact" hidden><figcaption>紧凑窗口 · 实际 Electron 窗口</figcaption><img src="compact.png" alt="紧凑窗口"></figure><footer>按账号的本机规则；先预览、再选择已有邮件。截图来自隔离 IMAP 测试邮箱。</footer><script>document.getElementById('page').onchange=function(){document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.page!==this.value);};</script></html>
