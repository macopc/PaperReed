<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Reed · 账号标识对照</title>
<style>
:root{--paper:#faf9f6;--paper-inset:#f2f1eb;--ink:#303730;--ink-soft:#626b60;--reed:#4b634f;--reed-wash:#e9eee5;--rule:rgba(63,75,60,.13);--background:var(--paper);--card:var(--paper);--foreground:var(--ink);--muted:var(--paper-inset);--muted-foreground:var(--ink-soft);--primary:var(--reed);--accent:var(--reed-wash);--border:var(--rule);--ring:#728c67;--radius:12px;--font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;--font-book:"Iowan Old Style",Georgia,serif;--work:#698594;--personal:#ac7b58;--studio:#8a789d}
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font:13px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}button:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:3px}button:active{opacity:.75}h1,h2,p{margin:0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}.brand{font:24px/32px var(--font-book);letter-spacing:-.8px}.caption{font-size:11px;color:var(--muted-foreground);margin-top:4px}.legend{display:flex;gap:16px;align-items:center;font-size:11px;color:var(--muted-foreground)}.legend span{display:flex;gap:6px;align-items:center}.legend i{width:8px;height:8px;background:var(--account);border-radius:2px}.legend .personal{border-radius:50%}.legend .studio{transform:rotate(45deg);width:7px;height:7px}.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.views{display:flex;gap:4px;flex-wrap:wrap}.views button{font-size:12px;padding:8px 12px;min-height:36px;border-radius:5px;color:var(--muted-foreground)}.views button[aria-pressed=true]{background:var(--accent);color:var(--primary);font-weight:600}.views button:hover{background:var(--muted)}.filter{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted-foreground)}select{padding:8px;border:1px solid var(--border);border-radius:5px;background:var(--card);max-width:140px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}.grid.single{grid-template-columns:minmax(0,1fr)}.variant{min-width:0}.variant>h2{font-size:13px;line-height:20px;font-weight:550;margin-bottom:12px;display:flex;gap:8px;align-items:center}.code{font:12px var(--font-book);color:var(--muted-foreground)}.shell{padding:16px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.inbox-head{display:flex;gap:12px;align-items:center;padding:4px 4px 16px;border-bottom:1px solid var(--border)}.inbox-head strong{font-size:18px;font-weight:600;letter-spacing:-.5px}.inbox-head span{margin-left:auto;font-size:11px;color:var(--muted-foreground)}.section-name{font-size:11px;color:var(--muted-foreground);padding:16px 8px 8px}.row{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;width:100%;min-height:88px;text-align:left;padding:10px 8px;position:relative;border-radius:5px;color:var(--foreground)}.row+.row:after{content:"";position:absolute;top:0;left:8px;right:8px;border-top:1px solid var(--border);opacity:.55}.row:hover{background:var(--muted)}.row[aria-pressed=true]{background:var(--accent)}.row[aria-pressed=true]:after,.row[aria-pressed=true]+.row:after{display:none}.identity{width:12px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px}.mark{display:block;background:var(--account);width:8px;height:8px;border-radius:2px}.personal .mark{border-radius:50%}.studio .mark{transform:rotate(45deg);width:7px;height:7px}.avatar .identity{width:36px;padding-top:1px}.portrait{width:32px;height:32px;border:1.5px solid var(--account);border-radius:50%;padding:3px;display:grid;place-items:center}.portrait b{background:var(--muted);color:var(--muted-foreground);font-size:10px;line-height:22px;font-weight:500;letter-spacing:-.3px;border-radius:50%;width:23px;height:23px;text-align:center}.portrait svg{width:15px;height:15px;vertical-align:-3px}.stripe .identity{width:8px;padding-top:4px}.bar{width:3px;height:32px;border-radius:2px;background:var(--account)}.copy{min-width:0}.meta{display:flex;align-items:center;gap:8px;line-height:20px}.sender{font-size:13px;font-weight:450;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.unread .sender,.unread .subject{font-weight:600}.time{margin-left:auto;flex:none;font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}.unread .time:before{content:"";width:4px;height:4px;border-radius:50%;background:var(--primary)}.subject,.snippet{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;line-height:20px}.subject{font-size:13px;margin-top:4px;font-weight:450}.snippet{font-size:12px;margin-top:4px;color:var(--muted-foreground)}.foot{border-top:1px solid var(--border);margin-top:12px;padding:12px 4px 0;display:flex;gap:8px;align-items:center;color:var(--muted-foreground);font-size:11px}.foot i{display:inline-block;width:6px;height:6px;background:var(--account);border-radius:2px}.status{margin-top:16px;font-size:11px;color:var(--muted-foreground);min-height:20px}.single .shell{padding:20px 24px}.single .row{min-height:68px;padding-top:12px;padding-bottom:12px}.single .copy{display:grid;grid-template-columns:144px minmax(0,1fr);column-gap:20px}.single .meta{display:contents}.single .sender{grid-column:1;grid-row:1;line-height:20px}.single .subject{grid-column:2;grid-row:1;margin:0;padding-right:60px}.single .snippet{grid-column:2;grid-row:2}.single .time{position:absolute;right:8px;top:12px}.single .identity{grid-row:1;padding-top:6px}.single .avatar .identity{padding-top:3px}.single .stripe .identity{padding-top:4px}.single .row{column-gap:12px}[hidden]{display:none!important}@media(max-width:679px){.grid{grid-template-columns:minmax(0,1fr);gap:24px}.shell{padding:16px}.single .shell{padding:16px}.single .copy{display:block}.single .meta{display:flex}.single .time{position:static}.single .subject{margin-top:4px;padding-right:0}.single .row{min-height:88px;padding-top:10px;padding-bottom:10px}.top{margin-bottom:16px}.legend{gap:12px}.controls{align-items:flex-start}.views button{padding:8px 10px}.filter{margin-left:auto}}
</style></head>
<body>
<header class="top"><div><div class="brand">Paper Reed</div><p class="caption">账号标识 · 三种候选</p></div><div class="legend" aria-label="账号颜色图例"><span><i style="--account:var(--work)"></i>工作</span><span><i class="personal" style="--account:var(--personal)"></i>个人</span><span><i class="studio" style="--account:var(--studio)"></i>工作室</span></div></header>
<div class="controls"><nav class="views" aria-label="对比方式"><button data-view="all" aria-pressed="true">并排对比</button><button data-view="a" aria-pressed="false">A 色块</button><button data-view="b" aria-pressed="false">B 头像</button><button data-view="c" aria-pressed="false">C 色条</button></nav><label class="filter">邮箱<select id="scope"><option value="all">所有邮箱</option><option value="work">工作邮箱</option><option value="personal">个人邮箱</option><option value="studio">工作室</option></select></label></div>
<main class="grid" id="grid"></main><p class="status" id="status" aria-live="polite">点击同一封邮件，比较三种方案的选中效果。示例数据。</p>
<script>
const accounts={work:{name:'工作邮箱',email:'alex@company.example'},personal:{name:'个人邮箱',email:'alex@personal.example'},studio:{name:'工作室',email:'alex@studio.example'}};
const messages=[{id:1,sender:'林 皓',initial:'林',account:'work',subject:'秋季刊，最后一遍校样',snippet:'封面和内页都准备好了，想听听你的意见。',time:'10:42',unread:true},{id:2,sender:'Maya Chen',initial:'MC',account:'work',subject:'周一，我们从这里开始',snippet:'会议时间确认了，带上最新校样就好。',time:'09:18',unread:true},{id:3,sender:'Maya Chen',initial:'MC',account:'personal',subject:'周末，去海边走走？',snippet:'找到一家小咖啡店，就在灯塔旁边。',time:'08:56',unread:false},{id:4,sender:'Fieldwork',initial:'F',account:'studio',subject:'新一期的纸张与印刷方案',snippet:'两种纸样已经寄出，周三应该能到。',time:'昨天',unread:true},{id:5,sender:'Dense Discovery',initial:'DD',account:'personal',subject:'A few things worth keeping',snippet:'Ideas, places, and a slower kind of Sunday.',time:'昨天',unread:false}];
const variants=[{id:'a',name:'小账号色块',className:'dot'},{id:'b',name:'头像与账号色环',className:'avatar'},{id:'c',name:'短账号色条',className:'stripe'}];
let chosen=1,view='all',scope='all';
function identity(m,v){if(v.id==='a')return '<span class="mark"></span>';if(v.id==='c')return '<span class="bar"></span>';return '<span class="portrait"><b>'+m.initial+'</b></span>'}
function render(){const shown=messages.filter(m=>scope==='all'||m.account===scope);document.getElementById('grid').className='grid'+(view==='all'?'':' single');document.getElementById('grid').innerHTML=variants.map(v=>`<section class="variant ${v.className}" ${view!=='all'&&view!==v.id?'hidden':''}><h2><span class="code">${v.id.toUpperCase()}</span>${v.name}</h2><div class="shell"><div class="inbox-head"><strong>收件箱</strong><span>${shown.length} 封邮件</span></div><div class="section-name">最近来信</div><div class="mail-list">${shown.map(m=>`<button class="row ${m.account} ${m.unread?'unread':''}" style="--account:var(--${m.account})" data-mail="${m.id}" aria-pressed="${chosen===m.id}" aria-label="${m.sender}，${m.subject}，${accounts[m.account].name}${m.unread?'，未读':''}" title="${accounts[m.account].name} · ${accounts[m.account].email}"><span class="identity" aria-hidden="true">${identity(m,v)}</span><span class="copy"><span class="meta"><span class="sender">${m.sender}</span><span class="time">${m.time}</span></span><span class="subject">${m.subject}</span><span class="snippet">${m.snippet}</span></span></button>`).join('')}</div><div class="foot"><i style="--account:var(--${messages.find(m=>m.id===chosen).account})"></i><span>${accounts[messages.find(m=>m.id===chosen).account].email}</span></div></div></section>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)))}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]'),m=e.target.closest('[data-mail]');if(v){view=v.dataset.view;render()}if(m){const variant=m.closest('.variant').classList[1];chosen=Number(m.dataset.mail);render();document.querySelector('.'+variant+' [data-mail="'+chosen+'"]').focus({preventScroll:true});const item=messages.find(m=>m.id===chosen);document.getElementById('status').textContent='已选：'+item.sender+' · '+accounts[item.account].name+'。三种方案同步选择。'}});
document.getElementById('scope').addEventListener('change',e=>{scope=e.target.value;chosen=messages.find(m=>scope==='all'||m.account===scope).id;render();document.getElementById('status').textContent='当前范围：'+(scope==='all'?'所有邮箱':accounts[scope].name)+'。为比较标识形态，此评审稿保留单账号标记。'});render();
</script></body></html>
