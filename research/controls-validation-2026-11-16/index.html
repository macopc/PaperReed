<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Reed 编辑器控件</title>
<style>
:root{--foreground:#303730;--muted-foreground:#626b60;--secondary:#f2f1eb;--border:#dfe2d9;--primary:#4b634f;--radius:6px;--font-sans:-apple-system,BlinkMacSystemFont,sans-serif}
body{margin:0;color:var(--foreground);font:13px/1.6 var(--font-sans)}nav,.controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;cursor:pointer}button[aria-pressed=true]{background:var(--secondary);color:var(--primary)}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}.controls .zoom{margin-left:auto}[hidden]{display:none!important}figure{margin:0}figcaption,p,footer{font-size:12px;color:var(--muted-foreground)}figcaption{margin:0 0 6px}.shot{position:relative;overflow:hidden;aspect-ratio:700/370;border:1px solid var(--border);border-radius:var(--radius)}.shot img{position:absolute;width:205.7143%;max-width:none;left:-67.1429%;top:-74.3243%;height:auto;display:block}.compact .shot{aspect-ratio:680/330}.compact .shot img{width:132.3529%;left:-26.4706%;top:-81.8182%}.full .shot{aspect-ratio:auto}.full .shot img{position:relative;left:0;top:0;width:100%}p{margin:10px 0 0}footer{margin-top:12px}a{color:var(--primary)}
</style>
<nav aria-label="控件场景"><button data-scene="recipients" aria-pressed="true">收件人</button><button data-scene="signatures" aria-pressed="false">签名</button><button data-scene="format" aria-pressed="false">格式工具</button><button data-scene="link" aria-pressed="false">链接</button><button data-scene="color" aria-pressed="false">文字颜色</button><button data-scene="signature-empty" aria-pressed="false">空签名</button><button data-scene="compact" aria-pressed="false">窄窗口</button></nav>
<div class="controls"><button data-mode="after" aria-pressed="true">调整后</button><button data-mode="before" aria-pressed="false">调整前</button><button id="zoom" class="zoom" aria-pressed="false">查看全窗口</button></div>
<main><section id="recipients" class="" ><figure data-version="after" ><figcaption>调整后 · 收件人 · <span class="scale-label">真实截图局部放大</span></figcaption><div class="shot"><img src="after-recipients.png" alt="调整后的收件人实际界面"></div></figure><figure data-version="before" hidden><figcaption>调整前 · 收件人 · <span class="scale-label">真实截图局部放大</span></figcaption><div class="shot"><img src="before-recipients.png" alt="调整前的收件人实际界面"></div></figure><p>同名联系人分层显示姓名与邮箱；选中态沿用苇绿。</p></section><section id="signatures" class="" hidden><figure data-version="after" ><figcaption>调整后 · 签名 · <span class="scale-label">真实截图局部放大</span></figcaption><div class="shot"><img src="after-signatures.png" alt="调整后的签名实际界面"></div></figure><figure data-version="before" hidden><figcaption>调整前 · 签名 · <span class="scale-label">真实截图局部放大</span></figcaption><div class="shot"><img src="before-signatures.png" alt="调整前的签名实际界面"></div></figure><p>名称、摘要和当前选择一起呈现，保留不使用签名与管理入口。</p></section><section id="format" class="" hidden><figure data-version="after" ><figcaption>调整后 · 格式工具 · <span class="scale-label">真实截图局部放大</span></figcaption><div class="shot"><img src="after-format.png" alt="调整后的格式工具实际界面"></div></figure><figure data-version="before" hidden><figcaption>调整前 · 格式工具 · <span class="scale-label">真实截图局部放大</span></figcaption><div class="shot"><img src="before-format.png" alt="调整前的格式工具实际界面"></div></figure><p>中文名称、工具分组和清晰选中态；展开与收起不改变正文。</p></section><section id="link" class="" hidden><figure data-version="after" ><figcaption>调整后 · 链接 · <span class="scale-label">真实截图局部放大</span></figcaption><div class="shot"><img src="after-link.png" alt="调整后的链接实际界面"></div></figure><p>对原选区添加链接，支持键盘确认和 Esc 取消。</p></section><section id="color" class="" hidden><figure data-version="after" ><figcaption>调整后 · 文字颜色 · <span class="scale-label">真实截图局部放大</span></figcaption><div class="shot"><img src="after-color.png" alt="调整后的文字颜色实际界面"></div></figure><p>常用颜色与自定义入口；颜色应用和恢复默认已验证。</p></section><section id="signature-empty" class="" hidden><figure data-version="after" ><figcaption>调整后 · 空签名 · <span class="scale-label">真实截图局部放大</span></figcaption><div class="shot"><img src="after-signature-empty.png" alt="调整后的空签名实际界面"></div></figure><p>没有签名时给出明确说明，不自动插入推广内容。</p></section><section id="compact" class="compact" hidden><figure data-version="after" ><figcaption>调整后 · 窄窗口 · <span class="scale-label">真实截图局部放大</span></figcaption><div class="shot"><img src="after-compact.png" alt="调整后的窄窗口实际界面"></div></figure><p>900×700 渲染视口：链接面板仍在窗口内。</p></section></main>
<footer>签名管理页、表情与系统颜色窗口仍待后续评审。<a href="README.md">验证记录与边界</a></footer>
<script>
let scene='recipients',mode='after',full=false;
function show(){document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!==scene);const s=document.getElementById(scene);document.querySelectorAll('[data-mode]').forEach(b=>{b.disabled=!s.querySelector('[data-version="'+b.dataset.mode+'"]');b.setAttribute('aria-pressed',String(b.dataset.mode===mode));});s.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.version!==mode);document.querySelector('main').classList.toggle('full',full);document.querySelectorAll('.scale-label').forEach(e=>e.textContent=full?'真实截图全窗口':'真实截图局部放大');const z=document.getElementById('zoom');z.textContent=full?'放大控件':'查看全窗口';z.setAttribute('aria-pressed',String(full));}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;mode='after';show();});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;show();});document.getElementById('zoom').onclick=()=>{full=!full;show();};show();
</script></html>
