function renderSearch(){return header('搜索','默认不包含垃圾邮件与废纸篓。',agentEntry())+`<div class="search-field">${icon('search')}<input id="search-query" aria-label="搜索邮件" placeholder="主题、发件人或正文" value="${esc(S.query)}"><button class="icon-button" data-act="query-clear" aria-label="清空关键词">${icon('close')}</button></div><div class="search-filters"><select id="search-account" aria-label="搜索邮箱范围"><option value="all" ${S.account==='all'?'selected':''}>所有邮箱</option>${Object.entries(acctNames).map(([id,name])=>`<option value="${id}" ${S.account===id?'selected':''}>${esc(name)}</option>`).join('')}</select><label><input type="checkbox" id="search-attachment" ${S.hasAttachment?'checked':''}>含附件</label><label><input type="checkbox" id="search-discarded" ${S.includeDiscarded?'checked':''}>含垃圾邮件与废纸篓</label><button class="text-button push" data-act="search-clear">重置</button></div><div id="search-results">${searchResults()}</div>`}
function renderSnooze(){const items=mail.filter(m=>m.folder==='snooze'&&(S.account==='all'||m.account===S.account));const times=[...new Set(items.map(m=>m.snoozed))].sort((a,b)=>{const rank=t=>t.startsWith('今天')?0:t.startsWith('明天')?1:2;return rank(a)-rank(b)});return header('稍后处理','在合适的时候，让邮件回到收件箱。')+`<div class="snooze-intro">${icon('clock')}提醒时间使用本机时区 · 纽约</div>`+(items.length?times.map(t=>`<section class="snooze-group"><h2 class="snooze-date">${esc(t.split(' ')[0])}<small>${t.includes('今天')?'11 月 14 日':t.includes('明天')?'11 月 15 日':'11 月 16 日'} · ${esc(t.split(' ')[1])}</small></h2>${items.filter(m=>m.snoozed===t).map(m=>`<div class="snooze-row">${row(m,{snooze:true})}<button class="restore" data-act="restore" data-id="${m.id}">移回收件箱</button></div>`).join('')}</section>`).join(''):empty('暂时没有稍后邮件','需要晚点处理时，在邮件里选择“稍后”。','<button class="line-button" data-act="goto" data-id="inbox">返回收件箱</button>'))}
function settingsTabs(){return `<nav class="view-tabs settings-tabs" aria-label="设置类别"><button data-act="accounts" aria-current="${S.page==='accounts'?'page':'false'}">邮箱与偏好</button><button data-act="agents" aria-current="${S.page==='agents'?'page':'false'}">外部 Agent</button></nav>`}
function renderAccounts(){return header('设置','你的邮箱，按你的习惯工作。')+settingsTabs()+`<div class="settings-content"><section class="settings-section"><div class="section-heading"><h2>已接入的邮箱</h2><p>3 个账号</p></div>${[['work','G','Google Workspace',false],['personal','i','iCloud',false],['archive','O','Outlook',true]].map(([id,letter,provider,expired])=>`<div class="account-row"><span class="account-monogram" style="color:${accountStyle[id].color};background:color-mix(in srgb,${accountStyle[id].color} 10%,var(--card))">${letter}</span><div class="account-info"><strong>${esc(acctNames[id])}<small>${provider}</small></strong><p>${acctEmails[id]}</p></div><span class="account-state ${expired?'warning':''}">${expired?'需要重新授权':'已同步'}</span><button class="text-button" data-act="${expired?'reconnect':'manage-account'}" data-id="${id}">${expired?'重新连接':'管理'}</button></div>`).join('')}<button class="add-account" data-act="add-account"><span>＋</span>添加邮箱</button></section><section class="settings-section"><div class="section-heading"><h2>收发偏好</h2></div><div class="setting-row"><div><strong>新邮件的默认发件人</strong><p>回复时自动使用收到原邮件的账号。</p></div><select id="default-sender" aria-label="默认发件人"><option value="work" ${S.defaultSender==='work'?'selected':''}>工作邮箱</option><option value="personal" ${S.defaultSender==='personal'?'selected':''}>个人邮箱</option></select></div><div class="setting-row"><div><strong>自动加载远程图片</strong><p>关闭后，可在阅读邮件时按需加载。</p></div><button class="switch" role="switch" aria-label="自动加载远程图片" aria-checked="${S.remoteImages}" data-act="remote-images"></button></div></section></div>`}
function renderAgents(){const name=clients[S.agent];return header('设置','让你常用的 Agent 在本机处理邮件。')+settingsTabs()+`<div class="settings-content"><section class="cli-sheet"><span class="agent-glyph" aria-hidden="true">${icon('agent')}</span><div><h2>从一封信，到你的 Agent</h2><p>${S.cliInstalled?'本机 CLI 已安装 · 示例状态':'安装本机 CLI，带着邮件上下文开始。'}</p></div>${S.cliInstalled?'<span class="small quiet">从邮件或草稿发起交接</span>':'<button class="secondary" data-act="agent-entry">安装引导</button>'}</section><section class="settings-section"><div class="section-heading"><h2>访问</h2></div><div class="setting-row"><div><strong>允许外部 Agent 访问</strong><p>通过本机客户端连接，共享同一份邮件状态。</p></div><button class="switch" role="switch" aria-label="允许外部 Agent 访问" aria-checked="${S.enabled}" data-act="agent-enable"></button></div></section><section class="settings-section"><div class="section-heading"><h2>连接到</h2></div><div class="agent-options">${Object.entries(clients).map(([key,label])=>`<button data-act="agent-client" data-id="${key}" aria-pressed="${S.agent===key}">${label}</button>`).join('')}</div><div class="connection-detail"><span class="agent-glyph" aria-hidden="true">${icon('agent')}</span><div><h3>${name}</h3><p>${S.enabled?(S.agentConnected[S.agent]?'已连接 · 示例状态':'尚未配置本机连接'):'外部访问已关闭'}</p></div><button class="secondary" data-act="agent-connect" ${S.enabled?'':'disabled'}>${S.agentConnected[S.agent]?'查看连接':'配置连接'}</button></div></section><section class="settings-section"><div class="section-heading"><h2>允许的操作</h2><p>应用于外部访问</p></div>${[['read','阅读与搜索','读取邮件正文、会话与附件信息。'],['organize','整理与草拟','归档、标记、稍后处理和创建回复草稿。'],['send','发送邮件','允许 Agent 从所选账号发送邮件。']].map(([key,label,desc])=>`<label class="permission-row"><input type="checkbox" data-permission="${key}" ${S.permissions[key]?'checked':''} ${S.enabled?'':'disabled'}><span><strong>${label}</strong><small>${desc}</small></span></label>`).join('')}</section><section class="settings-section"><div class="section-heading"><h2>可访问的邮箱</h2></div><div class="agent-scopes">${['work','personal'].map(a=>`<label><input type="checkbox" data-agent-account="${a}" ${S.agentAccounts[a]?'checked':''} ${S.enabled?'':'disabled'}>${esc(acctNames[a])}</label>`).join('')}</div></section></div>`}
function render(){const renderers={label:renderInbox,sent:renderInbox,spam:renderInbox,trash:renderInbox,organize:renderOrganize,inbox:renderInbox,pinned:renderInbox,drafts:renderInbox,archive:renderInbox,thread:renderThread,compose:renderCompose,search:renderSearch,snooze:renderSnooze,accounts:renderAccounts,agents:renderAgents};$('screen').innerHTML=(renderers[S.page]||renderInbox)();$('screen').setAttribute('aria-label',pageNames[S.page]);$('screen').dataset.page=S.page;$('scope').hidden=!['inbox','sent','drafts','archive','spam','trash','label','snooze','pinned','search'].includes(S.page);$('scope').innerHTML=(S.account==='all'?'所有邮箱':acctNames[S.account])+' <span class="chevron"></span>';document.querySelectorAll('[data-preview]').forEach(b=>b.setAttribute('aria-current',b.dataset.preview===(['pinned','drafts','archive'].includes(S.page)?'inbox':S.page)?'page':'false'));renderNav();bindFields()}
function go(page){S.checked.clear();closeNav();closeMenu();if(!$('overlay').hidden)closeModal();S.page=page;render();$('screen').scrollTop=0}
function openThread(id){
 const m=getMail(id);if(!m)return;
 if(m.folder==='draft'){loadComposer(m);return}
 if(S.page!=='thread'){S.returnPage=S.page;listScroll=$('screen').scrollTop}
 S.selected=m.id;m.unread=false;go('thread');
 if(S.returnPage==='drafts'&&S.replyDrafts[m.id])reply();
}
function back(){const target=S.returnPage==='thread'?'inbox':S.returnPage;go(target||'inbox');$('screen').scrollTop=listScroll}
function reply(){const m=current();if(!m)return;if(m.folder==='draft'){loadComposer(m);return}if(S.page!=='thread')openThread(m.id);S.replyOpenId=m.id;$('reply-trigger').hidden=true;$('reply-editor').hidden=false;$('reply-text').focus();$('reply-editor').scrollIntoView({block:'nearest'})}
function changeFolder(folder,snoozed){const m=current();if(!m)return;const old={folder:m.folder,snoozed:m.snoozed},oldId=m.id,oldPage=S.page;const origin=['inbox','pinned','drafts','archive'].includes(S.returnPage)?S.returnPage:'inbox';const before=rowsFor(origin),index=before.indexOf(m);m.folder=folder;m.snoozed=snoozed;closeMenu();if(oldPage==='thread'){const remaining=rowsFor(origin);S.selected=remaining[Math.max(0,Math.min(index,remaining.length-1))]?.id??null;if(!S.selected)go(origin);else render()}else render();notice(folder==='archive'?'邮件已归档':`将在${snoozed}回到收件箱`,()=>{Object.assign(m,old);S.selected=oldId;go(oldPage)})}
function restore(id){const m=getMail(id);if(!m)return;const old=m.snoozed,oldFolder=m.folder;m.folder='inbox';delete m.snoozed;render();notice('已移回收件箱',()=>{m.folder=oldFolder;m.snoozed=old;render()})}
function togglePin(){const m=current();if(!m)return;m.pinned=!m.pinned;closeMenu();render();notice(m.pinned?'已置顶':'已取消置顶')}
function openSnooze(anchor){closeMenu();popover(anchor,`<div class="menu-label">稍后回到收件箱</div>${menuButton('今天晚些时候','snooze-set','18:00','今天 18:00')}${menuButton('明天上午','snooze-set','09:00','明天 09:00')}${menuButton('下周一','snooze-set','09:00','下周一 09:00')}`)}
function saveComposer(){
 const c=S.composer;let m=c.id?getMail(c.id):null;
 if(!m){c.id=Math.max(...mail.map(m=>m.id))+1;m={id:c.id};mail.push(m)}
 Object.assign(m,{sender:'我',address:acctEmails[c.from],account:c.from,to:c.to,cc:c.cc,ccOpen:c.ccOpen,files:c.files.map(f=>({...f})),draftBody:c.body,subject:c.subject||'（无主题）',snippet:c.body.split('\n').find(Boolean)||'继续完成这封邮件',body:c.body.split('\n').filter(Boolean),signature:'Alex',time:'刚刚',folder:'draft',unread:false});
 const status=$('compose-status');if(status)status.textContent='草稿已保存';
}
function loadComposer(m){
 S.returnPage=S.page;
 S.composer={id:m.id,from:m.account,to:m.to||'',cc:m.cc||'',subject:m.subject,body:m.draftBody??m.body.join('\n\n'),files:(m.files||[]).map(f=>({...f})),ccOpen:!!(m.ccOpen||m.cc)};
 go('compose');$('compose-body').focus();

function newComposer(){S.returnPage=S.page;S.composer={id:null,from:S.defaultSender,to:'',cc:'',subject:'',body:'',files:[],ccOpen:false};go('compose');$('compose-to').focus()}
function sendComposer(){const c=S.composer;if(!c.to||!$('compose-to').checkValidity()){notice('请填写有效的收件人邮箱');$('compose-to').focus();return}if(c.cc&&!$('compose-cc').checkValidity()){notice('请检查抄送邮箱');return}if(!c.subject.trim()){notice('请填写邮件主题');$('compose-subject').focus();return}if(!c.body.trim()){notice('请先写下邮件正文');$('compose-body').focus();return}saveComposer();notice('发送流程演示完成；原型没有发送真实邮件。')}
function bindFields(){bindSelection();const bind=(id,event,fn)=>{if($(id))$(id).addEventListener(event,fn)};
bind('unread-filter','change',e=>{S.unreadOnly=e.target.checked;render()});
bind('search-query','input',e=>{S.query=e.target.value;$('search-results').innerHTML=searchResults();bindSelection()});
bind('search-account','change',e=>{act('scope-set',e.target.value);$('search-account').focus()});
bind('search-discarded','change',e=>{S.includeDiscarded=e.target.checked;$('search-results').innerHTML=searchResults();bindSelection()});
bind('search-attachment','change',e=>{S.hasAttachment=e.target.checked;$('search-results').innerHTML=searchResults();bindSelection()});
bind('reply-text','input',e=>{S.replyDrafts[S.selected]=e.target.value;$('reply-status').textContent='草稿已保存'});
[['compose-from','from'],['compose-to','to'],['compose-cc','cc'],['compose-subject','subject'],['compose-body','body']].forEach(([id,key])=>bind(id,id==='compose-from'?'change':'input',e=>{S.composer[key]=e.target.value;saveComposer()}));
bind('file-input','change',e=>{for(const file of e.target.files)S.composer.files.push({name:file.name,size:file.size>1024*1024?(file.size/1024/1024).toFixed(1)+' MB':Math.max(1,Math.round(file.size/1024))+' KB'});$('compose-files').innerHTML=composeFiles();saveComposer();$('file-status').textContent='附件仅在本机原型中展示';e.target.value=''});
bind('default-sender','change',e=>S.defaultSender=e.target.value);
document.querySelectorAll('[data-permission]').forEach(input=>input.onchange=()=>S.permissions[input.dataset.permission]=input.checked);
document.querySelectorAll('[data-agent-account]').forEach(input=>input.onchange=()=>S.agentAccounts[input.dataset.agentAccount]=input.checked);
}
function accountModal(id){showModal(modalHead(acctNames[id])+`<p>${acctEmails[id]}</p><div class="setting-row"><div><strong>账号名称</strong><p>用于统一收件箱中的账号标识。</p></div><input id="account-name" aria-label="账号名称" style="width:120px;border:1px solid var(--border);border-radius:4px;padding:7px" value="${esc(acctNames[id])}"></div><div class="setting-row"><div><strong>账号颜色</strong><p>用于列表标记，不染色整行。</p></div><input type="color" id="account-color" aria-label="账号颜色" value="${accountStyle[id].color}"></div><div class="setting-row"><div><strong>标记形状</strong><p>不用只依赖颜色区分账号。</p></div><select id="account-shape" aria-label="账号标记形状">${[['square','方形'],['circle','圆形'],['diamond','菱形']].map(([v,t])=>`<option value="${v}" ${accountStyle[id].shape===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="actions"><button class="secondary" data-act="modal-close">取消</button><button class="primary" data-act="save-account-name" data-id="${id}">保存</button></div>`)}
function addAccount(){showModal(modalHead('添加邮箱')+'<p>选择邮箱服务。正式客户端将在服务商页面完成授权。</p>'+[['Google','Gmail / Workspace'],['Microsoft','Outlook / Microsoft 365'],['iCloud','Apple 邮箱'],['其他邮箱','IMAP / SMTP']].map(([p,desc])=>`<button class="provider-option" data-act="provider" data-id="${p}">${p}<small>${desc}　›</small></button>`).join(''))}
function connectAgent(){const name=clients[S.agent];const scopes=Object.entries(S.permissions).filter(([,v])=>v).map(([k])=>({read:'阅读与搜索',organize:'整理与草拟',send:'发送邮件'})[k]);const accounts=Object.entries(S.agentAccounts).filter(([,v])=>v).map(([k])=>acctNames[k]);if(!scopes.length||!accounts.length){notice('请选择至少一种操作和一个邮箱');return}showModal(modalHead(`连接 ${name}`)+`<p>连接后，${name} 将通过本机客户端处理所选邮箱。客户端需要保持运行。</p><div class="setting-row"><strong>可访问邮箱</strong><span class="quiet small">${accounts.join('、')}</span></div><div class="setting-row"><strong>允许的操作</strong><span class="quiet small">${scopes.join('、')}</span></div><p style="margin-top:20px;font-size:11px">这是接入流程预览，不会写入 Agent 配置或连接真实邮箱。</p><div class="actions"><button class="secondary" data-act="modal-close">取消</button><button class="primary" data-act="agent-simulate">模拟连接</button></div>`)}
function commandList(q=''){
 const single=!S.checked.size&&['inbox','pinned','archive','drafts','label','sent','spam','trash','thread'].includes(S.page)&&current();
 const list=[['打开搜索','command-search','⌘ K'],...(S.checked.size?[[`归档选中的 ${S.checked.size} 封邮件`,'archive','E']]:single?[['归档当前邮件','archive','E'],['稍后处理','command-snooze','H'],['置顶 / 取消置顶','pin','P'],['回复当前邮件','reply','R']]:[]),['写邮件','compose-new','C'],['邮箱设置','accounts',''],['外部 Agent','agents','']].filter(([label])=>label.includes(q));
 return list.map(([label,action,key])=>menuButton(label,action,key)).join('')||'<p class="small quiet" style="padding:15px 7px">没有匹配的命令</p>';

function openCommands(){showModal('<input class="command-input" id="command-query" placeholder="输入命令…" aria-label="搜索命令"><div class="command-results" id="command-results">'+commandList()+'</div>');$('command-query').oninput=e=>$('command-results').innerHTML=commandList(e.target.value)}
function preview(page){if(page==='thread'){S.selected=2;S.returnPage='inbox'}if(page==='compose'&&!S.composer.subject)S.composer={...composerSeed,files:[]};if(page==='search'&&!S.query)S.query='校样';go(page)}

function agentContext(){
 if(S.page==='compose')return {type:'draft',label:'当前草稿',detail:S.composer.subject||'（无主题）',count:1,accounts:[S.composer.from]};
 if(S.page==='thread')return {type:'thread',label:S.replyOpenId===S.selected?'当前会话与回复草稿':'当前会话',detail:current()?.subject||'',count:1,accounts:[current()?.account]};
 const items=S.checked.size?selectedItems():S.page==='search'?searchItems():rowsFor(['inbox','pinned','drafts','archive','label','sent','spam','trash'].includes(S.page)?S.page:'inbox');

function launchAgent(savedTask){const context=S.page==='agents'?null:agentContext();
 if(!S.cliInstalled){showModal(modalHead('让 Agent 接手邮件')+`<p>先安装随客户端提供的 CLI，再连接你常用的 Agent。安装后，这个入口会直接携带当前邮件或草稿的上下文。</p>${context?`<div class="handoff-context"><span>${esc(context.label)}</span><strong>${esc(context.detail)}</strong></div>`:''}<ol class="install-steps"><li><strong>安装本机 CLI</strong><span>由桌面客户端提供，具体安装方式待实现确认。</span></li><li><strong>配置 Agent</strong><span>选择客户端与允许访问的邮箱。</span></li><li><strong>从这里继续处理</strong><span>带入选定内容，无需手动查找邮件。</span></li></ol><div class="actions"><button class="secondary" data-act="modal-close">稍后</button><button class="primary" data-act="cli-preview">预览安装完成态</button></div>`);return}
 const eligible=context.accounts.filter(a=>S.agentAccounts[a]).length;const ready=S.enabled&&S.agentConnected[S.agent]&&eligible>0&&S.permissions.read;const task=savedTask??(context.type==='draft'?'润色这封草稿，保留我的语气，不发送。':context.type==='thread'?'总结这段会话，并起草一封回复，不发送。':'整理当前列表，指出需要我回复的邮件，先给出建议。');
 showModal(modalHead('交给 Agent')+`<div class="handoff-context"><span>${esc(context.label)}</span><strong>${esc(context.detail)}</strong></div><label class="handoff-label" for="handoff-task">想让 Agent 做什么</label><textarea id="handoff-task" class="handoff-task">
${esc(task)}</textarea><div class="setting-row"><div><strong>${clients[S.agent]}</strong><p>${!S.enabled?'外部 Agent 访问已关闭':!eligible?'当前范围内没有已授权邮箱':!S.permissions.read?'需要允许阅读与搜索':S.agentConnected[S.agent]?'连接已配置（示例）':'需要配置本机连接'}</p></div><button class="text-button" data-act="handoff-config">${ready?'更换 / 设置':'配置连接'}</button></div><p class="small" style="margin:16px 0 0">${context.type==='list'?`仅带入其中 ${eligible} 封已授权邮件。`:eligible?'此邮箱已在授权范围内。':'此邮箱不在授权范围内。'} 写回草稿或整理邮件需另有对应权限；不会自动发送。</p><div class="actions"><button class="secondary" data-act="modal-close">取消</button><button class="primary" data-act="handoff-preview" ${ready?'':'disabled'}>交给 ${clients[S.agent]}</button></div>`)
}

function act(action,id,button){switch(action){
case 'commands':openCommands();break;
case 'agent-entry':launchAgent();break;
case 'cli-preview':S.cliInstalled=true;closeModal();render();if(S.page!=='agents')launchAgent();break;
case 'handoff-config':S.handoffOrigin={page:S.page,selected:S.selected,checked:[...S.checked],replyOpenId:S.replyOpenId,task:$('handoff-task').value};closeModal();go('agents');break;
case 'handoff-preview':if(!$('handoff-task').value.trim()){notice('请填写要处理的任务');break}closeModal();notice('交接预览已完成；未实际启动 Agent 或发送邮件。');break;
case 'nav-toggle':$('window').classList.toggle('nav-open');document.querySelector('.nav-scrim').hidden=!$('window').classList.contains('nav-open');button.setAttribute('aria-expanded',String($('window').classList.contains('nav-open')));if($('window').classList.contains('nav-open'))$('mail-nav').querySelector('button')?.focus();break;
case 'nav-close':closeNav();break;
case 'category':S.category=id;S.checked.clear();render();break;
case 'open-label':S.labelId=id;S.unreadOnly=false;go('label');break;
case 'organize-tab':S.organizeTab=id;render();break;
case 'label-new':labelEditor();break;
case 'label-edit':labelEditor(id);break;
case 'label-save':saveLabel(id);break;
case 'rule-new':ruleEditor();break;
case 'rule-edit':ruleEditor(Number(id));break;
case 'rule-preview':rulePreview();break;
case 'rule-save':saveRule(id);break;
case 'selection-clear':S.checked.clear();render();break;
case 'bulk-archive':batchArchive();break;
case 'bulk-label':popover(button,labels.map(l=>menuButton(esc(l.name),'bulk-label-set','',l.id)).join('')+'<hr>'+menuButton('新建标签','label-new'));break;
case 'bulk-label-set':{const items=selectedItems();items.forEach(m=>m.labels=[...new Set([...(m.labels||[]),id])]);closeMenu();render();notice('已为 '+items.length+' 封邮件添加标签');break}
case 'bulk-read':selectedItems().forEach(m=>m.unread=false);S.checked.clear();render();notice('已标记为已读');break;
case 'goto':S.unreadOnly=false;S.category='all';go(id);break;
case 'accounts':case 'agents':go(action);break;
case 'scope':popover(button,menuButton('所有邮箱','scope-set','','all')+Object.entries(acctNames).map(([id,name])=>menuButton(esc(name),'scope-set','',id)).join(''));break;
case 'scope-set':S.account=id;S.unreadOnly=false;go(S.page);break;
case 'open':openThread(id);break;
case 'back':back();break;
case 'bundle':S.bundle=!S.bundle;S.checked=new Set([...S.checked].filter(id=>activeItems().some(m=>m.id===id)));render();break;
case 'clear-unread':S.unreadOnly=false;render();break;
case 'archive':if(!$('overlay').hidden)closeModal();if(S.checked.size)batchArchive();else changeFolder('archive');break;
case 'pin':if(!$('overlay').hidden)closeModal();togglePin();break;
case 'snooze-menu':openSnooze(button);break;
case 'command-snooze':closeModal();openSnooze($('scope'));break;
case 'snooze-set':changeFolder('snooze',id);break;
case 'restore':restore(id);break;
case 'restore-current':restore(S.selected);break;
case 'thread-menu':popover(button,menuButton(current()?.pinned?'取消置顶':'置顶','pin','P')+menuButton('标记为未读','mark-unread','U')+menuButton('搜索此发件人','sender-search'));break;
case 'mark-unread':if(current())current().unread=true;go(S.returnPage);notice('已标记为未读');break;
case 'sender-search':S.query=current()?.sender||'';go('search');break;
case 'envelope':$('envelope').hidden=!$('envelope').hidden;button.setAttribute('aria-expanded',String(!$('envelope').hidden));break;
case 'reply':if(current()?.folder==='sent'){const m=current();newComposer();S.composer.to=m.to;S.composer.subject='Re: '+m.subject.replace(/^Re: /,'');render();break}if(!$('overlay').hidden)closeModal();reply();break;
case 'reply-collapse':S.replyOpenId=null;$('reply-editor').hidden=true;$('reply-trigger').hidden=false;break;
case 'reply-send':if(!$('reply-text').value.trim()){notice('请先写下回复');$('reply-text').focus()}else notice('发送流程演示完成；原型没有发送真实邮件。');break;
case 'attachment':notice('附件预览示例：'+current().attachment);break;
case 'compose-new':if(!$('overlay').hidden)closeModal();newComposer();break;
case 'compose-more':popover(button,menuButton('保存并返回','compose-return')+menuButton('丢弃这份草稿','compose-discard'));break;
case 'compose-return':saveComposer();back();break;
case 'compose-discard':if(S.composer.id){const i=mail.findIndex(m=>m.id===S.composer.id);if(i>=0)mail.splice(i,1)}S.composer={...composerSeed,id:null,subject:'',body:'',to:'',files:[]};go('inbox');notice('示例草稿已丢弃');break;
case 'compose-send':sendComposer();break;
case 'toggle-cc':S.composer.ccOpen=!S.composer.ccOpen;saveComposer();$('cc-field').hidden=!S.composer.ccOpen;if(S.composer.ccOpen)$('compose-cc').focus();break;
case 'attach-file':$('file-input').click();break;
case 'remove-file':S.composer.files.splice(Number(id),1);saveComposer();$('compose-files').innerHTML=composeFiles();break;
case 'search-open':S.returnPage=S.page;S.query='';go('search');$('search-query').focus();break;
case 'command-search':closeModal();S.returnPage=S.page;go('search');$('search-query').focus();break;
case 'query-clear':S.query='';$('search-query').value='';$('search-results').innerHTML=searchResults();bindSelection();$('search-query').focus();break;
case 'search-clear':S.query='';S.account='all';S.hasAttachment=false;S.includeDiscarded=false;render();$('search-query').focus();break;
case 'manage-account':accountModal(id);break;
case 'save-account-name':accountStyle[id].color=$('account-color').value;accountStyle[id].shape=$('account-shape').value;if($('account-name').value.trim())acctNames[id]=$('account-name').value.trim();closeModal();render();break;
case 'add-account':addAccount();break;
case 'provider':showModal(modalHead(`接入 ${esc(id)}`)+`<p>下一步将进入 ${esc(id)} 的授权流程。授权成功后，账号会出现在统一收件箱中。</p><p class="small">本原型不发起登录，也不接收任何邮箱凭据。</p><div class="actions"><button class="primary" data-act="modal-close">完成预览</button></div>`);break;
case 'reconnect':showModal(modalHead('重新连接邮箱')+`<p>${acctEmails[id]} 的授权已过期。已缓存的邮件仍可阅读，收发将在重新授权后继续。</p><div class="actions"><button class="secondary" data-act="modal-close">稍后</button><button class="primary" data-act="provider" data-id="Microsoft">查看授权流程</button></div>`);break;
case 'remote-images':S.remoteImages=!S.remoteImages;button.setAttribute('aria-checked',String(S.remoteImages));break;
case 'agent-enable':S.enabled=!S.enabled;render();break;
case 'agent-client':S.agent=id;render();break;
case 'agent-connect':connectAgent();break;
case 'agent-simulate':S.agentConnected[S.agent]=true;closeModal();if(S.handoffOrigin){const origin=S.handoffOrigin;S.handoffOrigin=null;S.selected=origin.selected;S.replyOpenId=origin.replyOpenId;go(origin.page);S.checked=new Set(origin.checked||[]);render();launchAgent(origin.task)}else render();notice('连接状态已模拟；没有修改本机 Agent 配置。');break;
case 'modal-close':closeModal();break;
case 'undo':const undo=S.undo;S.undo=null;$('toast').hidden=true;undo?.();break;
}}
document.addEventListener('click',e=>{const previewButton=e.target.closest('[data-preview]');if(previewButton){preview(previewButton.dataset.preview);return}const button=e.target.closest('button[data-act]');if(button){e.stopPropagation();act(button.dataset.act,button.dataset.id,button);return}if(e.target===$('overlay'))closeModal();if(!$('popover').contains(e.target)&&!S.menuAnchor?.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.isComposing)return;const modalOpen=!$('overlay').hidden;if(modalOpen){if(e.key==='Escape'){e.preventDefault();closeModal()}else if(e.key==='Tab'){const els=[...$('modal').querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled),i=els.indexOf(document.activeElement);e.preventDefault();els[(i+(e.shiftKey?-1:1)+els.length)%els.length]?.focus()}else if(['ArrowDown','ArrowUp'].includes(e.key)&&$('command-results')){e.preventDefault();const els=[...$('command-results').querySelectorAll('button')],i=els.indexOf(document.activeElement);els[(i+(e.key==='ArrowDown'?1:-1)+els.length)%els.length]?.focus()}return}
if($('window').classList.contains('nav-open')&&e.key==='Tab'){e.preventDefault();const els=[document.querySelector('.nav-toggle'),...$('mail-nav').querySelectorAll('button')],i=els.indexOf(document.activeElement);els[(i+(e.shiftKey?-1:1)+els.length)%els.length]?.focus();return}if(e.key==='Escape'){if($('window').classList.contains('nav-open')){closeNav();document.querySelector('.nav-toggle').focus();return}if(!$('popover').hidden)closeMenu(true);else if(S.page==='thread'||S.page==='compose')back();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommands();return}if(!$('popover').hidden&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const els=[...$('popover').querySelectorAll('button')],i=els.indexOf(document.activeElement);els[(i+(e.key==='ArrowDown'?1:-1)+els.length)%els.length]?.focus();return}if(document.activeElement.matches('input:not([type="checkbox"]),textarea,select')||document.activeElement.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;
const key=e.key.toLowerCase();if(S.checked.size&&['e','p','h','r'].includes(key)){e.preventDefault();if(key==='e')batchArchive();else notice('请取消勾选后操作单封邮件');return}const listPages=['inbox','pinned','archive','drafts','label','sent','spam','trash'];if(['j','k'].includes(key)&&(listPages.includes(S.page)||S.page==='thread')){const page=S.page==='thread'?(listPages.includes(S.returnPage)?S.returnPage:'inbox'):S.page;const list=rowsFor(page),i=list.findIndex(m=>m.id===S.selected),next=list[i+(key==='j'?1:-1)];if(next){S.selected=next.id;if(S.page==='thread')openThread(next.id);else{render();$('screen').querySelector(`[data-id="${next.id}"]`)?.scrollIntoView({block:'nearest'})}}e.preventDefault();return}if(key==='enter'&&listPages.includes(S.page)&&document.activeElement===document.body){openThread(S.selected);return}const actions={e:'archive',p:'pin',r:'reply',c:'compose-new'};if(actions[key]&&(listPages.includes(S.page)||S.page==='thread')){e.preventDefault();act(actions[key],null,$('scope'))}else if(key==='h'&&(listPages.includes(S.page)||S.page==='thread')){e.preventDefault();openSnooze($('scope'))}});
function closeNav(){$('window').classList.remove('nav-open');document.querySelector('.nav-scrim').hidden=true;document.querySelector('.nav-toggle').setAttribute('aria-expanded','false')}
function renderNav(){
 const count=p=>p==='inbox'?rowsFor('inbox').filter(m=>m.unread).length:p==='drafts'?rowsFor('drafts').length:p==='snooze'?rowsFor('snooze').length:0;
 const link=(p,t,glyph='')=>`<button class="nav-link" data-act="goto" data-id="${p}" aria-current="${S.page===p?'page':'false'}">${glyph}${t}${count(p)?`<span class="nav-count">${count(p)}</span>`:''}</button>`;
 $('mail-nav').innerHTML=`<div class="nav-section"><button class="nav-link" data-act="search-open" aria-current="${S.page==='search'?'page':'false'}">${icon('search')}搜索邮件</button><div class="nav-label">邮箱</div>${[['inbox','收件箱'],['drafts','草稿'],['sent','已发送'],['archive','归档'],['spam','垃圾邮件'],['trash','废纸篓']].map(([p,t])=>link(p,t)).join('')}</div><div class="nav-section"><div class="nav-label">留待处理</div>${link('pinned','置顶')}${link('snooze','稍后')}</div><div class="nav-section"><div class="nav-label">标签</div>${labels.map(l=>`<button class="nav-link" data-act="open-label" data-id="${l.id}" aria-current="${S.page==='label'&&S.labelId===l.id?'page':'false'}"><span class="tag-dot" style="background:${l.color}"></span>${esc(l.name)}</button>`).join('')}<button class="nav-manage" data-act="goto" data-id="organize">管理标签与规则</button></div><div class="nav-bottom">${link('agents','外部 Agent', icon('agent'))}${link('accounts','邮箱与偏好',icon('settings'))}</div>`;
}
function bindSelection(){document.querySelectorAll('[data-mail-check]').forEach(c=>c.onchange=()=>{const id=Number(c.dataset.mailCheck);c.checked?S.checked.add(id):S.checked.delete(id);const scroll=$('screen').scrollTop;render();$('screen').scrollTop=scroll;document.querySelector(`[data-mail-check="${id}"]`)?.focus()});document.querySelectorAll('[data-select-all]').forEach(c=>c.onchange=()=>{S.checked=c.checked?new Set(activeItems().map(m=>m.id)):new Set();render()});document.querySelectorAll('[data-rule-enable]').forEach(c=>c.onchange=()=>{const rule=rules.find(r=>r.id===Number(c.dataset.ruleEnable));rule.enabled=c.checked;notice('规则状态已更新，不追溯处理已有邮件。')})}
function batchArchive(){const items=selectedItems();const old=items.map(m=>[m.id,m.folder]);items.forEach(m=>m.folder='archive');S.checked.clear();render();notice('已归档 '+items.length+' 封邮件',()=>{old.forEach(([id,folder])=>getMail(id).folder=folder);render()})}
function actionName(action){if(action.startsWith('label:'))return '添加标签「'+(labels.find(l=>l.id===action.slice(6))?.name||'')+'」';return '分类为'+({people:'往来',notifications:'通知',subscriptions:'订阅'})[action.split(':')[1]]}
function renderOrganize(){return header('标签与分类','本机整理 · 不移动服务端文件夹。')+`<nav class="view-tabs"><button data-act="organize-tab" data-id="labels" aria-current="${S.organizeTab==='labels'?'page':'false'}">自定义标签</button><button data-act="organize-tab" data-id="rules" aria-current="${S.organizeTab==='rules'?'page':'false'}">自动分类规则</button></nav>`+(S.organizeTab==='labels'?`<section class="settings-section"><div class="section-heading"><h2>我的标签</h2><button class="line-button" data-act="label-new">＋ 新建标签</button></div>${labels.map(l=>`<div class="organize-row"><span class="tag-swatch" style="background:${l.color}"></span><div><strong>${esc(l.name)}</strong><p>${mail.filter(m=>(m.labels||[]).includes(l.id)).length} 封邮件 · 可与其他标签共存</p></div><button class="text-button" data-act="label-edit" data-id="${l.id}">编辑</button></div>`).join('')}<p class="subtitle" style="margin-top:22px">在列表中勾选邮件，再使用“标签”整理。标签视图保留原邮件的位置。</p></section>`:`<section class="settings-section"><div class="section-heading"><h2>按条件自动整理</h2><button class="line-button" data-act="rule-new">＋ 新建规则</button></div>${rules.map(r=>`<div class="organize-row"><input type="checkbox" data-rule-enable="${r.id}" aria-label="启用规则 ${esc(r.query)}" ${r.enabled?'checked':''}><div><strong>${r.field==='sender'?'发件人':'主题'}包含「${esc(r.query)}」</strong><p>${esc(actionName(r.action))}</p></div><button class="text-button" data-act="rule-edit" data-id="${r.id}">编辑</button></div>`).join('')}<p class="subtitle" style="margin-top:22px">先预览匹配范围，再决定是否应用到已有邮件。关闭规则不会撤销已完成的整理。</p></section>`)}
function labelEditor(id){const l=labels.find(l=>l.id===id);showModal(modalHead(l?'编辑标签':'新建标签')+`<div class="rule-field"><label for="label-name">名称</label><input id="label-name" maxlength="24" value="${esc(l?.name||'')}" placeholder="例如：客户项目"></div><div class="rule-field"><label for="label-color">颜色</label><input id="label-color" type="color" value="${l?.color||'#8978a3'}"></div><div class="actions"><button class="secondary" data-act="modal-close">取消</button><button class="primary" data-act="label-save" data-id="${id||''}">保存</button></div>`)}
function saveLabel(id){const name=$('label-name').value.trim();if(!name){notice('请填写标签名称');return}if(labels.some(l=>l.name===name&&l.id!==id)){notice('这个标签名称已存在');return}const color=$('label-color').value;let l=labels.find(l=>l.id===id);if(l)Object.assign(l,{name,color});else labels.push({id:'tag-'+Date.now(),name,color});closeModal();render();notice('标签已保存')}
function ruleEditor(id){const r=rules.find(r=>r.id===id)||{field:'subject',query:'校样',action:'label:project'};showModal(modalHead(id?'编辑规则':'新建规则')+`<div class="rule-field"><label for="rule-field">当</label><select id="rule-field"><option value="subject" ${r.field==='subject'?'selected':''}>主题包含</option><option value="sender" ${r.field==='sender'?'selected':''}>发件人包含</option></select></div><div class="rule-field"><label for="rule-query">关键词</label><input id="rule-query" value="${esc(r.query)}"></div><div class="rule-field"><label for="rule-action">执行</label><select id="rule-action">${[['category:people','分类为往来'],['category:notifications','分类为通知'],['category:subscriptions','分类为订阅'],...labels.map(l=>['label:'+l.id,'添加标签：'+l.name])].map(([v,t])=>`<option value="${v}" ${r.action===v?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="rule-preview" id="rule-preview">预览匹配后再保存。</div><button class="text-button" data-act="rule-preview">预览匹配邮件</button><label class="rule-apply"><input id="rule-apply" type="checkbox">同时应用于已有邮件</label><div class="actions"><button class="secondary" data-act="modal-close">取消</button><button class="primary" data-act="rule-save" data-id="${id||''}">保存规则</button></div>`);rulePreview()}
function readRule(){return {field:$('rule-field').value,query:$('rule-query').value.trim(),action:$('rule-action').value,enabled:true}}
function matchRule(r){return r.query?mail.filter(m=>!['draft','sent','spam','trash'].includes(m.folder)&&(r.field==='sender'?m.sender+' '+m.address:m.subject).toLowerCase().includes(r.query.toLowerCase())):[]}
function rulePreview(){const matches=matchRule(readRule());$('rule-preview').innerHTML=`匹配 ${matches.length} 封邮件${matches.length?'<br>'+matches.slice(0,3).map(m=>esc(m.subject)).join('<br>'):''}`}
function saveRule(id){const data=readRule();if(!data.query){notice('请填写匹配关键词');return}const matches=matchRule(data);let rule=rules.find(r=>r.id===Number(id));if(rule)Object.assign(rule,data);else rules.push({id:Date.now(),...data});const apply=$('rule-apply').checked;const old=matches.map(m=>({id:m.id,category:m.category,labels:[...(m.labels||[])]}));if(apply)matches.forEach(m=>{const [kind,value]=data.action.split(':');if(kind==='label')m.labels=[...new Set([...(m.labels||[]),value])];else m.category=value});closeModal();S.organizeTab='rules';go('organize');notice(apply?'规则已保存，并整理 '+matches.length+' 封邮件':'规则已保存；已有邮件未改动',apply?()=>{old.forEach(x=>Object.assign(getMail(x.id),{category:x.category,labels:x.labels}));render()}:null)}

saveComposer();S.page=document.body.dataset.initial||'inbox';render();
</script>
</body></html>
