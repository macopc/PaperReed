<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Reed 编辑器对照</title>
<style>
:root{--foreground:#303730;--muted-foreground:#626b60;--secondary:#f2f1eb;--border:#dfe2d9;--primary:#4b634f;--radius:6px;--font-sans:-apple-system,BlinkMacSystemFont,sans-serif}
body{margin:0;color:var(--foreground);font:13px/1.6 var(--font-sans)}nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}button{font:inherit;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:inherit;padding:5px 10px;cursor:pointer}button[aria-pressed=true]{background:var(--secondary);color:var(--primary)}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}[hidden]{display:none!important}.modes{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}.modes span{margin-left:auto;font-size:11px;color:var(--muted-foreground)}figure{margin:0}figcaption{font-size:12px;color:var(--muted-foreground);margin:0 0 6px}img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:var(--radius);box-sizing:border-box}p,footer{font-size:12px;color:var(--muted-foreground);margin:10px 0 0}a{color:var(--primary)}
</style>
<nav aria-label="场景"><button data-page="compose" aria-pressed="true">写信</button><button data-page="reply" aria-pressed="false">回复</button><button data-page="conflict" aria-pressed="false">冲突</button><button data-page="recovery-list" aria-pressed="false">副本列表</button><button data-page="recovery-copy" aria-pressed="false">副本编辑</button><button data-page="source-unavailable" aria-pressed="false">原稿不可用</button><button data-page="long-subject" aria-pressed="false">长主题</button></nav>
<div class="modes" aria-label="比较版本"><button data-mode="after" aria-pressed="true">调整后</button><button data-mode="before" aria-pressed="false">调整前</button><button data-mode="design" aria-pressed="false">设计稿</button><span>实际 Electron · 本机测试邮箱</span></div>
<main><section id="compose" ><figure data-version="after" ><figcaption>调整后 · 写信</figcaption><img src="compose.png" alt="调整后 · 写信"></figure><figure data-version="before" hidden><figcaption>调整前 · 写信</figcaption><img src="../ui-validation-2026-11-16/compose.png" alt="调整前 · 写信"></figure><figure data-version="design" hidden><figcaption>设计参照 · 示例内容不同</figcaption><img src="../ux-audit-2026-11-16/design-compose.png" alt="设计参照 · 示例内容不同"></figure><p>主题成为可编辑标题，发件人在前；格式收起，发送靠右。</p></section><section id="reply" hidden><figure data-version="after" ><figcaption>调整后 · 回复</figcaption><img src="reply.png" alt="调整后 · 回复"></figure><figure data-version="before" hidden><figcaption>调整前 · 回复</figcaption><img src="../ui-validation-2026-11-16/reply.png" alt="调整前 · 回复"></figure><figure data-version="design" hidden><figcaption>设计参照 · 示例内容不同</figcaption><img src="../ux-audit-2026-11-16/design-thread.png" alt="设计参照 · 示例内容不同"></figure><p>与写信共用编辑器和版心；设计参照为会话页面。</p></section><section id="conflict" hidden><figure data-version="after" ><figcaption>调整后 · 冲突</figcaption><img src="conflict.png" alt="调整后 · 冲突"></figure><figure data-version="before" hidden><figcaption>调整前 · 冲突</figcaption><img src="../ui-validation-2026-11-16/conflict.png" alt="调整前 · 冲突"></figure><p>编辑区内保留冲突说明和处理入口，取消重复的全页提示。</p></section><section id="recovery-list" hidden><figure data-version="after" ><figcaption>调整后 · 副本列表</figcaption><img src="recovery-list.png" alt="调整后 · 副本列表"></figure><p>原稿标明现存副本数量；恢复副本以稳定编号及创建时间辨识。</p></section><section id="recovery-copy" hidden><figure data-version="after" ><figcaption>调整后 · 副本编辑</figcaption><img src="recovery-copy.png" alt="调整后 · 副本编辑"></figure><p>来源独立于邮件主题，提供查看原稿；不会随邮件发给收件人。</p></section><section id="source-unavailable" hidden><figure data-version="after" ><figcaption>调整后 · 原稿不可用</figcaption><img src="source-unavailable.png" alt="调整后 · 原稿不可用"></figure><p>原稿已发送或不可读时说明情况，保留副本和编辑能力。</p></section><section id="long-subject" hidden><figure data-version="after" ><figcaption>调整后 · 长主题</figcaption><img src="long-subject.png" alt="调整后 · 长主题"></figure><p>主题自然换行；抄送、密送存在时增加纵向空间。</p></section></main>
<footer>副本异常态暂无对应设计稿。收件人补全、格式面板及弹出窗口仍待统一。<a href="README.md">验证记录与剩余缺口</a></footer>
<script>
let page='compose',mode='after';
function show(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!==page);const section=document.getElementById(page);document.querySelectorAll('[data-mode]').forEach(b=>{b.disabled=!section.querySelector('[data-version="'+b.dataset.mode+'"]');b.setAttribute('aria-pressed',String(b.dataset.mode===mode));});section.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.version!==mode);}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;mode='after';show();}));document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;show();}));show();
</script></html>
