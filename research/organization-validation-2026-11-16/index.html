<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Reed 外观、规则与文件夹</title><style>:root{--foreground:#303730;--muted-foreground:#626b60;--primary:#4b634f;--secondary:#f2f1eb;--border:#dfe2d9;--radius:6px;--font-sans:-apple-system,sans-serif}body{margin:0;font:13px/1.6 var(--font-sans);color:var(--foreground)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select{font:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--secondary);color:var(--primary)}button:focus-visible,select:focus-visible{outline:2px solid var(--primary)}button:disabled{opacity:.45;cursor:default}[hidden]{display:none}figure{margin:0}img{display:block;width:100%;border:1px solid var(--border);border-radius:var(--radius);box-sizing:border-box}figcaption,footer{font-size:12px;color:var(--muted-foreground);margin:6px 0}a{color:var(--primary)}</style><nav><select aria-label="设置页面" id="page"><option value="appearance">外观</option><option value="rules">邮件规则</option><option value="folders">文件夹</option><option value="run">规则处理确认</option><option value="compact-rules">小窗口 · 规则</option><option value="compact-folders">小窗口 · 文件夹</option></select><button id="after" aria-pressed="true">本轮</button><button id="before" aria-pressed="false">上一轮</button></nav><figure data-page="appearance" data-phase="before" hidden><figcaption>外观 · 上一轮 · 实际 Electron 窗口</figcaption><img src="before-appearance.png" alt="外观"></figure><figure data-page="appearance" data-phase="after" ><figcaption>外观 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-appearance.png" alt="外观"></figure><figure data-page="rules" data-phase="before" hidden><figcaption>邮件规则 · 上一轮 · 实际 Electron 窗口</figcaption><img src="before-rules-empty.png" alt="邮件规则"></figure><figure data-page="rules" data-phase="after" hidden><figcaption>邮件规则 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-rule-editor.png" alt="邮件规则"></figure><figure data-page="folders" data-phase="before" hidden><figcaption>文件夹 · 上一轮 · 实际 Electron 窗口</figcaption><img src="before-folders.png" alt="文件夹"></figure><figure data-page="folders" data-phase="after" hidden><figcaption>文件夹 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-folders-saved.png" alt="文件夹"></figure><figure data-page="run" data-phase="after" hidden><figcaption>规则处理确认 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-rule-run-confirm.png" alt="规则处理确认"></figure><figure data-page="compact-rules" data-phase="after" hidden><figcaption>小窗口 · 规则 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-compact-rules.png" alt="小窗口 · 规则"></figure><figure data-page="compact-folders" data-phase="after" hidden><figcaption>小窗口 · 文件夹 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-compact-folders.png" alt="小窗口 · 文件夹"></figure><footer>独立测试邮箱；未发送邮件。<a href="README.md">验证与边界</a></footer><script>let phase='after';const page=document.getElementById('page'),before=document.getElementById('before'),after=document.getElementById('after');function update(){before.disabled=!['appearance','rules','folders'].includes(page.value);if(before.disabled)phase='after';before.setAttribute('aria-pressed',String(phase==='before'));after.setAttribute('aria-pressed',String(phase==='after'));document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.page!==page.value||f.dataset.phase!==phase);}page.onchange=update;before.onclick=()=>{phase='before';update();};after.onclick=()=>{phase='after';update();};</script></html>
