<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Reed 本机整理</title><style>:root{--foreground:#303730;--muted-foreground:#626b60;--primary:#4b634f;--secondary:#f2f1eb;--border:#dfe2d9;--radius:6px;--font-sans:-apple-system,sans-serif}body{margin:0;font:13px/1.6 var(--font-sans);color:var(--foreground)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select{font:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--secondary);color:var(--primary)}button:focus-visible,select:focus-visible{outline:2px solid var(--primary)}button:disabled{opacity:.45;cursor:default}[hidden]{display:none}figure{margin:0}img{display:block;width:100%;border:1px solid var(--border);border-radius:var(--radius);box-sizing:border-box}figcaption,footer{font-size:12px;color:var(--muted-foreground);margin:6px 0}a{color:var(--primary)}</style><nav><select aria-label="查看页面" id="page"><option value="inbox">收件箱 · 置顶与标签</option><option value="labels">标签管理</option><option value="label-view">标签视图</option><option value="label-picker">批量标签</option><option value="snooze-picker">选择稍后时间</option><option value="snoozed">稍后视图</option><option value="reader">阅读页整理</option><option value="compact">紧凑窗口</option></select></nav><figure data-page="inbox" ><figcaption>收件箱 · 置顶与标签 · 实际 Electron 窗口</figcaption><img src="inbox.png" alt="收件箱 · 置顶与标签"></figure><figure data-page="labels" hidden><figcaption>标签管理 · 实际 Electron 窗口</figcaption><img src="labels.png" alt="标签管理"></figure><figure data-page="label-view" hidden><figcaption>标签视图 · 实际 Electron 窗口</figcaption><img src="label-view.png" alt="标签视图"></figure><figure data-page="label-picker" hidden><figcaption>批量标签 · 实际 Electron 窗口</figcaption><img src="label-picker.png" alt="批量标签"></figure><figure data-page="snooze-picker" hidden><figcaption>选择稍后时间 · 实际 Electron 窗口</figcaption><img src="snooze-picker.png" alt="选择稍后时间"></figure><figure data-page="snoozed" hidden><figcaption>稍后视图 · 实际 Electron 窗口</figcaption><img src="snoozed.png" alt="稍后视图"></figure><figure data-page="reader" hidden><figcaption>阅读页整理 · 实际 Electron 窗口</figcaption><img src="reader.png" alt="阅读页整理"></figure><figure data-page="compact" hidden><figcaption>紧凑窗口 · 实际 Electron 窗口</figcaption><img src="compact.png" alt="紧凑窗口"></figure><footer>状态保存在本机；标签色点保持一致，文字使用中性色。截图来自隔离测试邮箱。</footer><script>document.getElementById('page').onchange=function(){document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.page!==this.value);};</script></html>
