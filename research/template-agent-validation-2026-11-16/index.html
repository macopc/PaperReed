<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Reed 模板与 Agent 设置</title><style>:root{--foreground:#303730;--muted-foreground:#626b60;--primary:#4b634f;--secondary:#f2f1eb;--border:#dfe2d9;--radius:6px;--font-sans:-apple-system,sans-serif}body{margin:0;font:13px/1.6 var(--font-sans);color:var(--foreground)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select{font:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--secondary);color:var(--primary)}button:focus-visible,select:focus-visible{outline:2px solid var(--primary)}button:disabled{opacity:.45;cursor:default}[hidden]{display:none}figure{margin:0}img{display:block;width:100%;border:1px solid var(--border);border-radius:var(--radius);box-sizing:border-box}figcaption,footer{font-size:12px;color:var(--muted-foreground);margin:6px 0}a{color:var(--primary)}</style><nav><select aria-label="查看页面" id="page"><option value="templates">邮件模板</option><option value="agent">Agent 连接</option><option value="connection">连接方式与 CLI</option><option value="scope">邮箱与文件夹</option><option value="audit">操作记录</option><option value="compose">写信模板入口</option><option value="compact-templates">小窗口 · 模板</option><option value="compact-agent">小窗口 · Agent</option></select><button id="after" aria-pressed="true">本轮</button><button id="before" aria-pressed="false">上一轮</button></nav><figure data-page="templates" data-phase="after" ><figcaption>邮件模板 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-template-edited.png" alt="邮件模板"></figure><figure data-page="templates" data-phase="before" hidden><figcaption>邮件模板 · 上一轮 · 实际 Electron 窗口</figcaption><img src="before-templates.png" alt="邮件模板"></figure><figure data-page="agent" data-phase="after" hidden><figcaption>Agent 连接 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-agent.png" alt="Agent 连接"></figure><figure data-page="agent" data-phase="before" hidden><figcaption>Agent 连接 · 上一轮 · 实际 Electron 窗口</figcaption><img src="before-agent.png" alt="Agent 连接"></figure><figure data-page="connection" data-phase="after" hidden><figcaption>连接方式与 CLI · 本轮 · 实际 Electron 窗口</figcaption><img src="after-agent-connection.png" alt="连接方式与 CLI"></figure><figure data-page="scope" data-phase="after" hidden><figcaption>邮箱与文件夹 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-agent-scope.png" alt="邮箱与文件夹"></figure><figure data-page="audit" data-phase="after" hidden><figcaption>操作记录 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-agent-audit.png" alt="操作记录"></figure><figure data-page="compose" data-phase="after" hidden><figcaption>写信模板入口 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-composer-template-entry.png" alt="写信模板入口"></figure><figure data-page="compact-templates" data-phase="after" hidden><figcaption>小窗口 · 模板 · 本轮 · 实际 Electron 窗口</figcaption><img src="after-compact-templates.png" alt="小窗口 · 模板"></figure><figure data-page="compact-agent" data-phase="after" hidden><figcaption>小窗口 · Agent · 本轮 · 实际 Electron 窗口</figcaption><img src="after-compact-agent.png" alt="小窗口 · Agent"></figure><footer>独立测试邮箱；未发送邮件；令牌已遮盖。</footer><script>let phase='after';const page=document.getElementById('page'),before=document.getElementById('before'),after=document.getElementById('after');function update(){before.disabled=!['templates','agent'].includes(page.value);if(before.disabled)phase='after';before.setAttribute('aria-pressed',String(phase==='before'));after.setAttribute('aria-pressed',String(phase==='after'));document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.page!==page.value||f.dataset.phase!==phase);}page.onchange=update;before.onclick=()=>{phase='before';update();};after.onclick=()=>{phase='after';update();};</script></html>
