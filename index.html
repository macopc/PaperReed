<h1>Paper Reed</h1>
<p>Paper Reed 是一个开源 macOS 邮件客户端。你可以在统一收件箱搜索和整理来自 Gmail、iCloud 以及兼容 IMAP 的邮箱，并在桌面端撰写、审阅和发送邮件。</p>
<p>连接 Gmail 时，Paper Reed 通过浏览器请求 Google 授权，用于识别邮箱账号、同步邮件与文件夹、保存草稿、整理邮件和发信。邮件索引保存在本机。你也可以在设置中开启 Agent 连接，并选择 Agent 可以访问的邮箱和执行的操作。</p>
<p><a href="https://github.com/macopc/PaperReed/releases/latest">下载 Paper Reed</a> · <a href="https://github.com/macopc/PaperReed">查看源码</a> · <a href="https://github.com/macopc/PaperReed/issues/new/choose">报告问题</a></p>
