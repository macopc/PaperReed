name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Prototype and documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 scripts/check.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: research/cli/native/go.mod
          cache: false
      - name: Build and check the native CLI
        run: |
          (cd research/cli/native && CGO_ENABLED=0 GOTOOLCHAIN=local GOPROXY=off go build -trimpath -o "$RUNNER_TEMP/paper-reed-cli" .)
          PAPER_REED_NATIVE_CLI="$RUNNER_TEMP/paper-reed-cli" node --test research/harness/check-cli-transport.cjs
      - run: git diff --exit-code

  desktop:
    name: Pinned patches and desktop TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 scripts/prepare-desktop.py "$RUNNER_TEMP/paper-reed-desktop" --typecheck
      - run: node research/harness/check-desktop-updates.cjs "$RUNNER_TEMP/paper-reed-desktop"
