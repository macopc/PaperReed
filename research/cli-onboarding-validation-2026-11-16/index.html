<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Reed CLI 与 Agent 接入</title><style>:root{--foreground:#303730;--muted-foreground:#626b60;--primary:#4b634f;--secondary:#f2f1eb;--border:#dfe2d9;--radius:6px;--font-sans:-apple-system,sans-serif}body{margin:0;font:13px/1.6 var(--font-sans);color:var(--foreground)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select{font:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--secondary);color:var(--primary)}button:focus-visible,select:focus-visible{outline:2px solid var(--primary)}button:disabled{opacity:.45;cursor:default}[hidden]{display:none}figure{margin:0}img{display:block;width:100%;border:1px solid var(--border);border-radius:var(--radius);box-sizing:border-box}figcaption,footer{font-size:12px;color:var(--muted-foreground);margin:6px 0}a{color:var(--primary)}</style><nav><select aria-label="查看页面" id="page"><option value="agent">Agent 接入</option><option value="install">安装前</option><option value="terminal">终端使用</option><option value="draft">草稿交接</option><option value="mailbox">收件箱交接</option><option value="stale">连接待更新</option><option value="offline">连接恢复提示</option><option value="compact">小窗口</option></select><button id="after" aria-pressed="true">本轮</button><button id="before" aria-pressed="false">上一轮</button></nav><figure data-page="agent" data-phase="after" ><figcaption>Agent 接入 · 本轮 · 实际 Electron 窗口</figcaption><img src="installed.png" alt="Agent 接入"></figure><figure data-page="agent" data-phase="before" hidden><figcaption>Agent 接入 · 上一轮 · 实际 Electron 窗口</figcaption><img src="previous-agent.png" alt="Agent 接入"></figure><figure data-page="install" data-phase="after" hidden><figcaption>安装前 · 本轮 · 实际 Electron 窗口</figcaption><img src="before-install.png" alt="安装前"></figure><figure data-page="terminal" data-phase="after" hidden><figcaption>终端使用 · 本轮 · 实际 Electron 窗口</figcaption><img src="terminal-help.png" alt="终端使用"></figure><figure data-page="draft" data-phase="after" hidden><figcaption>草稿交接 · 本轮 · 实际 Electron 窗口</figcaption><img src="draft-handoff.png" alt="草稿交接"></figure><figure data-page="mailbox" data-phase="after" hidden><figcaption>收件箱交接 · 本轮 · 实际 Electron 窗口</figcaption><img src="mailbox-handoff.png" alt="收件箱交接"></figure><figure data-page="stale" data-phase="after" hidden><figcaption>连接待更新 · 本轮 · 实际 Electron 窗口</figcaption><img src="connection-stale.png" alt="连接待更新"></figure><figure data-page="offline" data-phase="after" hidden><figcaption>连接恢复提示 · 本轮 · 实际 Electron 窗口</figcaption><img src="offline-recovery.png" alt="连接恢复提示"></figure><figure data-page="compact" data-phase="after" hidden><figcaption>小窗口 · 本轮 · 实际 Electron 窗口</figcaption><img src="compact.png" alt="小窗口"></figure><footer>隔离安装与测试邮箱；未发送邮件。第三方 Agent 会话尚未逐一验收。</footer><script>let phase='after';const page=document.getElementById('page'),before=document.getElementById('before'),after=document.getElementById('after');function update(){before.disabled=!['agent'].includes(page.value);if(before.disabled)phase='after';before.setAttribute('aria-pressed',String(phase==='before'));after.setAttribute('aria-pressed',String(phase==='after'));document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.page!==page.value||f.dataset.phase!==phase);}page.onchange=update;before.onclick=()=>{phase='before';update();};after.onclick=()=>{phase='after';update();};</script></html>
